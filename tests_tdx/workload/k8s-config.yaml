apiVersion: v1
clusters:
- cluster:
    certificate-authority-data: 
    server: https://pandora.intel.com:8443
  name: kubernetes
contexts:
- context:
    cluster: kubernetes
    user: kubernetes-admin
  name: kubernetes-admin@kubernetes
current-context: kubernetes-admin@kubernetes
kind: Config
preferences: {}
users:
- name: kubernetes-admin
  user:
    client-certificate-data: 
    client-key-data: 

templates:
  deployment: |
    apiVersion: apps/v1
    kind: Deployment
    metadata:
      name: $name
    spec:
      selector:
        matchLabels:
          app: $app
      template:
        metadata:
          labels:
            app: $app
        spec:
          containers:
          - name: $container_name
            image: $container_image
            ports:
              - containerPort: $port
            imagePullPolicy: IfNotPresent
          nodeName: td-guest

  service: |
    apiVersion: v1
    kind: Service
    metadata:
      name: $name
    spec:
      ports:
      - port: $port
        protocol: TCP
      selector:
        app: $app
      type: NodePort

  job: |
    apiVersion: batch/v1
    kind: Job
    metadata:
      name: $name
    spec:
      template:
        spec:
          containers:
          - name: $container_name
            image: $container_image
            command: $cmd
            args: $args
            imagePullPolicy: IfNotPresent
          restartPolicy: Never
          nodeName: td-guest
      backoffLimit: 0
