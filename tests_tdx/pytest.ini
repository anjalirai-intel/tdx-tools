[pytest]
log_format = %(asctime)s %(levelname)s %(message)s
log_date_format = %Y-%m-%d %H:%M:%S
log_level = DEBUG
log_cli = True
timeout = 10800
cache_dir = cache
output_dir = output
artifacts = artifacts.yaml
markers =
    vm_name: Name to be given to a VM instance
    vm_image: OS image to be used by a given VM instance
    vm_kernel: VM kernel binary
    vm_factory: Factory to create and manage the VM
    vm_ssh_key: The private key for running SSH remote command
    vm_ssh_pubkey: The public key need be copied into VM for SSH remote command
    bat: Select the test functions for BAT testing
    smoke: Select the test functions for SMOKE testing
    artifact_factory: Artifact factory defined in artifacts.yaml
    regression: Select the test functions for Functional regression testing, no attestation, no perf
    nontme: Select some tests for legacy VM on non-TME host
    kubevirt: Select some tests for kubevirt-tdx